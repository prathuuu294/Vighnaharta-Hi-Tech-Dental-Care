<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Vighnaharta Dental</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; background-color: #020617; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        h2 { color: #00e5ff; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); color: white; box-sizing: border-box; font-family: 'Poppins', sans-serif;}
        input:focus { outline: none; border-color: #00e5ff; }
        button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; border: none; background: #00e5ff; color: #020617; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: 'Poppins', sans-serif;}
        button:hover { box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); transform: translateY(-2px); }
        .error { color: #ff4d4d; font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Portal</h2>
        {% if error %} <div class="error">{{ error }}</div> {% endif %}
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Secure Login</button>
        </form>
    </div>
</body>
</html>
